name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment ==="
          java -version
          echo "JAVA_HOME: ${JAVA_HOME}"
          
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print ($1 == "1" ? $2 : $1)}')
          echo "Detected Java Major Version: ${JAVA_VER}"
          
          if [ -z "${JAVA_VER}" ]; then
            echo "ERROR: Unable to detect Java major version."
            exit 1
          fi
          
          if [ "${JAVA_VER}" -lt 17 ]; then
            echo "ERROR: Java major version is ${JAVA_VER}, but version 17 or higher is required."
            exit 1
          fi
          
          echo "Java environment successfully verified."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to verify debug.keystore creation."
            exit 1
          fi
          echo "Debug keystore is ready."

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify Debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "ERROR: Expected debug APK not found at ${EXPECTED_APK}"
            echo "Listing APK files discovered in app/build/outputs/apk:"
            find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk" 2>/dev/null || echo "No APKs found."
            exit 1
          fi
          
          if [ ! -s "${EXPECTED_APK}" ]; then
            echo "ERROR: APK file is empty: ${EXPECTED_APK}"
            exit 1
          fi
          
          case "${EXPECTED_APK}" in
            *.apk) ;;
            *)
              echo "ERROR: File does not have .apk extension: ${EXPECTED_APK}"
              exit 1
              ;;
          esac
          
          echo "Verified debug APK at: ${EXPECTED_APK} ($(du -h "${EXPECTED_APK}" | cut -f1))"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_ASSET_DIR="${RUNNER_TEMP}/apk_release_asset"
          mkdir -p "${TEMP_ASSET_DIR}"
          
          REPO_NAME=$(basename "${{ github.repository }}" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9._-' '-')
          REPO_NAME=${REPO_NAME#-}
          REPO_NAME=${REPO_NAME%-}
          if [ -z "${REPO_NAME}" ]; then
            REPO_NAME="android-app"
          fi
          
          ASSET_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${TEMP_ASSET_DIR}/${ASSET_NAME}"
          
          cp "app/build/outputs/apk/debug/app-debug.apk" "${ASSET_PATH}"
          
          if [ ! -s "${ASSET_PATH}" ]; then
            echo "ERROR: Prepared release asset is missing or empty."
            exit 1
          fi
          
          echo "asset_path=${ASSET_PATH}" >> $GITHUB_OUTPUT
          echo "asset_name=${ASSET_NAME}" >> $GITHUB_OUTPUT
          echo "Prepared release asset: ${ASSET_PATH}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI version..."
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ]; then
            echo "ERROR: Release asset invalid at ${ASSET_PATH}"
            exit 1
          fi
          
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          
          RELEASE_NOTES=$(cat <<EOF
          ### Automated Debug APK Build

          - **Build:** #${{ github.run_number }} (Attempt #${{ github.run_attempt }})
          - **Commit:** \`${{ github.sha }}\`
          - **Built By:** GitHub Actions

          ---
          > **Note:** This is an automatically generated debug APK intended for testing and demonstration purposes. It is signed with a temporary debug keystore and is not a production release.
          EOF
          )
          
          echo "Creating GitHub Release with tag: ${TAG_NAME}"
          gh release create "${TAG_NAME}" "${ASSET_PATH}" \
            --title "${RELEASE_TITLE}" \
            --notes "${RELEASE_NOTES}" \
            --target "${{ github.sha }}" \
            --latest
            
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_title=${RELEASE_TITLE}" >> $GITHUB_OUTPUT

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PUBLISH_OUTCOME="${{ steps.publish_release.outcome }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          
          if [ "${PUBLISH_OUTCOME}" = "success" ]; then
            echo "GitHub Release published successfully."
            gh release view "${TAG_NAME}" || true
            
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}"
            echo "=== Release Information ==="
            echo "Tag: ${TAG_NAME}"
            echo "Release URL: ${RELEASE_URL}"
            echo "Asset: ${ASSET_NAME}"
            
            {
              echo "## 🚀 Debug APK Build & Release Summary"
              echo ""
              echo "- **Status:** ✅ Successfully Built & Published"
              echo "- **Release Tag:** \`${TAG_NAME}\`"
              echo "- **Release Page:** [View Release and Download APK](${RELEASE_URL})"
              echo "- **APK Asset Filename:** \`${ASSET_NAME}\`"
              echo ""
              echo "### 📱 Direct Download"
              echo "The debug APK can be downloaded directly from the **Assets** section of the [GitHub Release](${RELEASE_URL})."
              echo ""
              echo "> 📦 **Backup:** The GitHub Actions artifact \`app-debug-apk\` is also preserved and available in the workflow run summary."
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::GitHub Release publishing was skipped or failed. The debug APK was built and is available as an Actions artifact."
            
            {
              echo "## ⚠️ Debug APK Build Summary"
              echo ""
              echo "- **Build Status:** ✅ Debug APK successfully built"
              echo "- **Release Status:** ⚠️ Release creation encountered an issue or was skipped"
              echo ""
              echo "### 📦 Download Artifact"
              echo "The compiled debug APK is safely preserved as a workflow artifact named **\`app-debug-apk\`** at the bottom of this run summary."
            } >> $GITHUB_STEP_SUMMARY
          fi
